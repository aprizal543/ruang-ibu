# Isolated Direct Upload configuration for Admin CMS QA.
# Use this file only from a staged QA upload directory as `wrangler.toml`.
# Never copy it over the production project's wrangler.toml.
name = "ruang-ibu-admin-qa"
compatibility_date = "2026-10-27"
pages_build_output_dir = "./dist"

# Keep the QA project's production environment deliberately unbound. The
# approved workflow deploys only the `admin-qa` Preview branch.
[env.production]
compatibility_date = "2026-10-27"

# QA deployments use a non-production branch and the staging database only.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "ruang-ibu-staging"
database_id = "125bcaa1-014f-43ad-8600-05e1c4341c76"
migrations_dir = "migrations"

[env.preview.vars]
GOOGLE_OAUTH_CLIENT_ID = "58823770770-u4bos8a1vpoop99jfdo6iv7apeeoaejc.apps.googleusercontent.com"
# Public Turnstile site key is configured here only when the staging widget exists.
# Its secret key remains an encrypted Pages Preview secret.
TURNSTILE_SITE_KEY = "0x4AAAAAAFpKJAIKPH02hJSd"
TURNSTILE_ALLOWED_HOSTNAMES = "admin-qa.ruang-ibu-admin-qa.pages.dev"
